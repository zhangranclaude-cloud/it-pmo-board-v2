<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Defense in depth: the only permitted network destination is the FormSubmit endpoint. Keep connect-src in sync with FORMSUBMIT_ENDPOINT. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://formsubmit.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>IT PMO – Project Board (Demo)</title>
<style>
/* ===== Design tokens: navy/blue palette, semantic red + amber, type + spacing scale ===== */
:root {
  color-scheme: light dark;
  --on-signal: #ffffff;
  --hatch-gap: #c9d6e8;
  --ink:       #0e2a47;   /* navy: text, Done */
  --ink-soft:  #4a5d78;
  --paper:     #f3f6fa;   /* cool page background */
  --surface:   #ffffff;
  --rule:      #cbd6e4;
  --signal:    #1d5fd1;   /* primary actions, In Progress */
  --signal-dk: #164ba8;
  --pale:      #e2ebf8;
  --steel:     #a9bbd2;   /* Backlog */
  --late:      #b42318;   /* overdue + critical only */
  --late-bg:   #fdecea;
  --amber:     #b54708;   /* high priority only */
  --amber-bg:  #fef0e1;
  --hatch: repeating-linear-gradient(135deg, var(--ink) 0 3px, var(--hatch-gap) 3px 7px); /* Blocked */
  --fs-xs: .75rem;
  --fs-sm: .8125rem;
  --fs-md: .9375rem;
  --fs-lg: 1.25rem;
  --fs-xl: 1.5625rem;
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  /* IBM Plex Sans only if installed locally; no web fonts are loaded */
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* Dark mode follows the OS setting */
@media (prefers-color-scheme: dark) {
  :root {
    --ink:       #e3ebf6;
    --ink-soft:  #a3b4ca;
    --paper:     #0b1726;
    --surface:   #12233a;
    --rule:      #2a405e;
    --signal:    #6ea8ff;
    --signal-dk: #9cc3ff;
    --on-signal: #061325;
    --pale:      #1b3253;
    --steel:     #5f7896;
    --late:      #ff8f86;
    --late-bg:   #3b1719;
    --amber:     #f2a865;
    --amber-bg:  #3a2512;
    --hatch-gap: #2a405e;
  }
}

/* ===== Base ===== */
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ===== Buttons ===== */
.btn {
  border: 1px solid var(--signal);
  background: var(--signal);
  color: var(--on-signal);
  padding: var(--sp-2) var(--sp-4);
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}
.btn:hover { background: var(--signal-dk); border-color: var(--signal-dk); }
.btn[disabled] { opacity: .65; cursor: progress; }
.btn-secondary { background: transparent; color: var(--signal); border-color: var(--rule); }
.btn-secondary:hover { background: var(--pale); }

/* ===== Header: wordmark, Add task, flow bar ===== */
.app-header {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: start;
  gap: var(--sp-4) var(--sp-5);
  padding: var(--sp-5) var(--sp-6) var(--sp-4);
}
.header-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--sp-2); }
.wordmark { margin: 0; font-size: var(--fs-xl); font-weight: 800; line-height: 1.1; }
.wordmark-sub { margin: 2px 0 0; font-size: var(--fs-sm); color: var(--ink-soft); }
.summary { grid-column: 1 / -1; }
.summary-line { margin: 0 0 var(--sp-2); font-size: var(--fs-md); }
.summary-late { color: var(--late); font-weight: 650; }
.flow { display: flex; gap: 3px; margin: 0; padding: 0; list-style: none; }
.flow-seg { min-width: 6.5rem; }
.flow-bar { display: block; height: 12px; border-radius: 2px; }
.flow-seg:first-child .flow-bar { border-radius: 6px 2px 2px 6px; }
.flow-seg:last-child .flow-bar  { border-radius: 2px 6px 6px 2px; }
.flow-seg.is-empty .flow-bar { background: transparent; outline: 1px dashed var(--steel); outline-offset: -1px; }
.flow-label { display: block; margin-top: var(--sp-1); font-size: var(--fs-sm); color: var(--ink-soft); }
.flow-label strong { color: var(--ink); }

/* One swatch per status, shared by the flow bar and the lane heads */
.swatch-backlog     { background: var(--steel); }
.swatch-in-progress { background: var(--signal); }
.swatch-blocked     { background: var(--hatch); }
.swatch-done        { background: var(--ink); }

/* ===== Filter bar ===== */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  align-items: end;
  margin: 0 var(--sp-6);
  padding: var(--sp-4) 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.filters .field { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 170px; }
.filters .field-grow { flex: 1 1 200px; }
.filters-note { margin-left: auto; padding-bottom: 10px; font-size: var(--fs-sm); color: var(--ink-soft); }

label { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-soft); }
input[type="text"], input[type="date"], select, textarea {
  width: 100%;
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--surface);
}
input:hover, select:hover, textarea:hover { border-color: var(--steel); }
textarea { min-height: 84px; resize: vertical; }
[aria-invalid="true"] { border-color: var(--late); background: var(--late-bg); }
.error { color: var(--late); font-size: var(--fs-sm); margin: var(--sp-1) 0 0; min-height: 1em; }

/* ===== Board: four lanes, each headed by its status swatch ===== */
main { padding: var(--sp-5) var(--sp-6); }
.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--sp-5);
  align-items: start;
}
.column {
  min-width: 0;
  min-height: 220px;
  padding: 0 var(--sp-2) var(--sp-3);
  border-radius: 6px;
  outline: 2px dashed transparent;
  outline-offset: 2px;
  transition: background-color .12s, outline-color .12s;
}
.column.drop-target { background: var(--pale); outline-color: var(--signal); }
.lane-bar { display: block; height: 6px; border-radius: 3px; margin: 0 calc(-1 * var(--sp-2)) var(--sp-3); }
.column-head { display: flex; align-items: baseline; gap: var(--sp-2); }
.column-head h2 { margin: 0; font-size: var(--fs-md); font-weight: 700; }
.count { font-size: var(--fs-md); color: var(--ink-soft); }
.column-sub { font-size: var(--fs-sm); color: var(--ink-soft); margin: 2px 0 var(--sp-3); }
.cards { display: flex; flex-direction: column; gap: var(--sp-2); }
.empty {
  color: var(--ink-soft);
  font-size: var(--fs-sm);
  text-align: center;
  padding: var(--sp-5) var(--sp-3);
  margin: 0;
  border: 1px dashed var(--rule);
  border-radius: 6px;
}

/* ===== Cards: flat, quiet; colour only where it means something ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: var(--sp-3);
  cursor: grab;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.card:hover { border-color: var(--steel); }
.card.dragging { opacity: .45; }
.card.prio-critical { box-shadow: inset 3px 0 0 var(--late); }
.card.prio-high     { box-shadow: inset 3px 0 0 var(--amber); }
/* Finished work steps back: no priority stripe, softer title */
[data-status="Done"] .card { box-shadow: none; }
[data-status="Done"] .card-title { color: var(--ink-soft); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); }
.card-id { font-size: var(--fs-xs); color: var(--ink-soft); }
.card-title { margin: 0; font-size: var(--fs-md); font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.card-project { margin: 0; font-size: var(--fs-sm); color: var(--ink-soft); }
.card-people {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--sp-2);
  padding-top: var(--sp-2);
  border-top: 1px solid var(--pale);
  font-size: var(--fs-sm);
}
.assignee { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.initials {
  flex: none;
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--pale);
  color: var(--ink);
  font-size: .6875rem;
  font-weight: 700;
}
.due { text-align: right; white-space: nowrap; }
.due-rel { display: block; font-weight: 600; }
.due-date { display: block; font-size: var(--fs-xs); color: var(--ink-soft); }
.due.is-late .due-rel { color: var(--late); }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-3); font-size: var(--fs-xs); }
.prio { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.prio::before { content: ""; width: 8px; height: 8px; border-radius: 1px; background: var(--steel); }
.prio-critical::before { background: var(--late); }
.prio-high::before     { background: var(--amber); }
.prio-medium::before   { background: var(--signal); }
.tag { color: var(--ink-soft); }
.card-actions { display: flex; align-items: center; gap: var(--sp-1); margin-left: auto; }
.link-btn {
  min-height: 26px;
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 2px var(--sp-2);
  font-size: var(--fs-xs);
  cursor: pointer;
  color: var(--signal);
  font-weight: 600;
}
.link-btn:hover { background: var(--pale); }
.link-btn.danger { color: var(--late); border-color: var(--late); }
.icon-btn {
  min-width: 28px;
  min-height: 28px;
  background: transparent;
  border: none;
  color: var(--ink-soft);
  font-size: 1.15rem;
  line-height: 1;
  padding: 2px var(--sp-2);
  border-radius: 4px;
  cursor: pointer;
}
.icon-btn:hover { color: var(--late); background: var(--late-bg); }
.confirm { display: flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-xs); font-weight: 600; color: var(--late); }
.move-select { font-size: var(--fs-xs); padding: 2px var(--sp-1); width: auto; }

/* ===== Footer note ===== */
.footnote { text-align: center; font-size: var(--fs-sm); color: var(--ink-soft); padding: 0 var(--sp-4) var(--sp-5); margin: 0; }

/* ===== Modal (native dialog) ===== */
dialog {
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 0;
  width: min(560px, calc(100vw - 24px));
  color: var(--ink);
  background: var(--surface);
  box-shadow: 0 16px 48px rgba(14, 42, 71, .28);
}
dialog::backdrop { background: rgba(14, 42, 71, .5); }
.dialog-head {
  padding: var(--sp-4) var(--sp-5) 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.dialog-head h2 { margin: 0; font-size: var(--fs-lg); }
form { padding: var(--sp-4) var(--sp-5) var(--sp-5); display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3) var(--sp-4); }
form .full { grid-column: 1 / -1; }
.form-actions { display: flex; justify-content: flex-end; gap: var(--sp-2); grid-column: 1 / -1; padding-top: var(--sp-2); }
.req { color: var(--late); }

/* Error summary: focused after a failed submit, links jump to each field */
.error-summary {
  border: 1px solid var(--late);
  border-left-width: 4px;
  border-radius: 6px;
  background: var(--late-bg);
  padding: var(--sp-3) var(--sp-4);
}
.error-summary-title { margin: 0 0 var(--sp-1); font-weight: 650; }
.error-summary ul { margin: 0; padding-left: var(--sp-5); }
.error-summary a { color: var(--late); font-size: var(--fs-sm); }

/* Status update dialog */
.status-body { padding: var(--sp-4) var(--sp-5) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); }
.status-note { margin: 0; font-size: var(--fs-sm); color: var(--ink-soft); }
.status-text { min-height: 300px; font-size: var(--fs-sm); line-height: 1.5; }
.status-actions { display: flex; justify-content: flex-end; gap: var(--sp-2); }

/* ===== Toasts ===== */
.toast-region {
  position: fixed;
  right: var(--sp-4);
  bottom: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  z-index: 50;
  max-width: min(380px, calc(100vw - 32px));
}
.toast {
  background: var(--ink);
  color: var(--paper);
  border-radius: 6px;
  padding: var(--sp-3) var(--sp-4);
  box-shadow: 0 6px 20px rgba(14, 42, 71, .25);
  font-size: var(--fs-sm);
  animation: toast-in .18s ease-out;
}
.toast.warn { background: var(--amber-bg); color: var(--ink); border: 1px solid var(--amber); }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) {
  .toast { animation: none; }
  .column { transition: none; }
}

/* ===== Responsive: two lanes below 1000px, one below 640px ===== */
@media (max-width: 999px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 639px) {
  .app-header { grid-template-columns: 1fr; padding: var(--sp-4) var(--sp-4) var(--sp-3); }
  .header-actions { justify-content: stretch; }
  .header-actions .btn { flex: 1 1 0; }
  .filters { margin: 0 var(--sp-4); }
  .filters .field { min-width: 0; flex: 1 1 40%; }
  .filters .field-grow { flex-basis: 100%; order: -1; }
  .filters-note { margin-left: 0; }
  main { padding: var(--sp-4); }
  .board { grid-template-columns: 1fr; }
  .column { min-height: 0; }
  .flow-seg { min-width: 4.25rem; }
  form { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ===== Header: wordmark, Add task, live flow bar summary ===== -->
<header class="app-header">
  <div>
    <h1 class="wordmark">IT PMO</h1>
    <p class="wordmark-sub">Project board (demo)</p>
  </div>
  <div class="header-actions">
    <button type="button" class="btn btn-secondary" id="open-status">Status update</button>
    <button type="button" class="btn" id="open-add">Add task</button>
  </div>
  <section class="summary" id="summary" aria-label="Board summary"></section>
</header>

<!-- ===== Filter bar ===== -->
<section class="filters" aria-label="Board filters">
  <div class="field">
    <label for="filter-project">Project</label>
    <select id="filter-project"></select>
  </div>
  <div class="field field-grow">
    <label for="filter-assignee">Assignee contains</label>
    <input type="text" id="filter-assignee" placeholder="e.g. Tan" autocomplete="off">
  </div>
  <div class="field">
    <label for="filter-priority">Priority</label>
    <select id="filter-priority"></select>
  </div>
  <div class="field">
    <label for="filter-due">Due</label>
    <select id="filter-due">
      <option value="">Any date</option>
      <option value="overdue">Overdue</option>
      <option value="week">In the next 7 days</option>
    </select>
  </div>
  <button type="button" class="btn btn-secondary" id="clear-filters">Clear filters</button>
  <span class="filters-note" id="filter-note" role="status" aria-atomic="true"></span>
</section>

<!-- ===== Kanban board (rendered by renderBoard) ===== -->
<main>
  <section class="board" id="board" aria-label="Kanban board"></section>
</main>
<p class="footnote">Demo data is held in memory only. Refreshing the page resets the board to the seeded tasks.</p>

<!-- ===== Add Task modal ===== -->
<dialog id="add-dialog" aria-labelledby="add-title">
  <div class="dialog-head">
    <h2 id="add-title">Add task</h2>
    <button type="button" class="icon-btn" id="close-add" aria-label="Close Add Task dialog">×</button>
  </div>
  <form id="task-form" novalidate>
    <div class="error-summary full" id="error-summary" role="alert" tabindex="-1" aria-labelledby="error-summary-title" hidden>
      <p class="error-summary-title" id="error-summary-title"></p>
      <ul id="error-summary-list"></ul>
    </div>
    <div class="full">
      <label for="f-title">Task title <span class="req" aria-hidden="true">*</span></label>
      <input type="text" id="f-title" name="title" maxlength="80" autocomplete="off" aria-describedby="err-title">
      <p class="error" id="err-title"></p>
    </div>
    <div class="full">
      <label for="f-description">Description (optional, max 500)</label>
      <textarea id="f-description" name="description" maxlength="500" aria-describedby="err-description"></textarea>
      <p class="error" id="err-description"></p>
    </div>
    <div>
      <label for="f-project">Project / Workstream</label>
      <select id="f-project" name="project" aria-describedby="err-project"></select>
      <p class="error" id="err-project"></p>
    </div>
    <div>
      <label for="f-category">Category</label>
      <select id="f-category" name="category" aria-describedby="err-category"></select>
      <p class="error" id="err-category"></p>
    </div>
    <div>
      <label for="f-assignee">Assignee <span class="req" aria-hidden="true">*</span></label>
      <input type="text" id="f-assignee" name="assignee" maxlength="60" autocomplete="off" aria-describedby="err-assignee">
      <p class="error" id="err-assignee"></p>
    </div>
    <div>
      <label for="f-priority">Priority</label>
      <select id="f-priority" name="priority" aria-describedby="err-priority"></select>
      <p class="error" id="err-priority"></p>
    </div>
    <div>
      <label for="f-due">Due date <span class="req" aria-hidden="true">*</span></label>
      <input type="date" id="f-due" name="dueDate" aria-describedby="err-dueDate">
      <p class="error" id="err-dueDate"></p>
    </div>
    <div>
      <label for="f-status">Status</label>
      <select id="f-status" name="status" aria-describedby="err-status"></select>
      <p class="error" id="err-status"></p>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" id="cancel-add">Cancel</button>
      <button type="submit" class="btn" id="submit-btn">Add task</button>
    </div>
  </form>
</dialog>

<!-- ===== Status update modal (weekly summary for stakeholders) ===== -->
<dialog id="status-dialog" aria-labelledby="status-title">
  <div class="dialog-head">
    <h2 id="status-title">Status update</h2>
    <button type="button" class="icon-btn" id="close-status" aria-label="Close status update">×</button>
  </div>
  <div class="status-body">
    <p class="status-note">A summary of the whole board, ignoring filters. Copy it into an email or chat.</p>
    <label for="status-text" class="visually-hidden">Status update text</label>
    <textarea id="status-text" class="status-text" readonly></textarea>
    <div class="status-actions">
      <button type="button" class="btn btn-secondary" id="done-status">Close</button>
      <button type="button" class="btn" id="copy-status">Copy to clipboard</button>
    </div>
  </div>
</dialog>

<!-- ===== Toast region (screen-reader friendly) ===== -->
<div class="toast-region" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
/* =====================================================================
   CONFIG
   ---------------------------------------------------------------------
   FormSubmit requires a ONE-TIME ACTIVATION: the first submission sends a
   confirmation email to the address below. Notifications are only delivered
   after the link in that email has been clicked.
   ===================================================================== */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/ranzhen123456@hotmail.com";

/* ===== Constants / reference data ===== */
const STATUSES   = ["Backlog", "In Progress", "Blocked", "Done"];
const STATUS_HINT = {
  "Backlog": "Logged, not yet scheduled",
  "In Progress": "Actively being worked",
  "Blocked": "Waiting on dependency, vendor or approval",
  "Done": "Completed / closed"
};
const PROJECTS   = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

/* ===== State: single source of truth (in memory only, no storage APIs) ===== */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "", due: "" },
  nextId: 1,
  ui: { moveOpenId: null, confirmDeleteId: null, dragId: null, focusKey: null }
};

/* ===== Helpers ===== */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function pad(n) { return String(n).padStart(2, "0"); }

/* Local-time YYYY-MM-DD, offset by a number of days from today. */
function dateString(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-GB",{ day: "2-digit", month: "short", year: "numeric" });
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < dateString(0);
}

function nextTaskId() {
  return "UOB-ITPM-" + String(state.nextId++).padStart(4, "0");
}

function slug(text) { return text.toLowerCase().replace(/\s+/g, "-"); }

/* Whole days from today (local) to an ISO date; negative = in the past. */
function daysUntil(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((new Date(y, m - 1, d) - today) / 86400000);
}

function dueLabel(task) {
  if (task.status === "Done") return "Completed";
  const days = daysUntil(task.dueDate);
  if (days < 0) return `Overdue by ${-days} ${days === -1 ? "day" : "days"}`;
  if (days === 0) return "Due today";
  if (days === 1) return "Due tomorrow";
  return `Due in ${days} days`;
}

function initials(name) {
  return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
}

/* ===== Seed data (relative dates so the demo always has overdue/upcoming items) ===== */
function seedTasks() {
  const seed = [
    ["Migrate FX pricing service to AWS", "Lift-and-shift the FX pricing microservice and cut over DNS.", "Infrastructure & Cloud", "Infrastructure", "Priya Nair", "High", 21, "In Progress"],
    ["Patch CVE-2025-XXXX on branch teller VDI", "Roll out vendor security patch to all branch teller VDI pools.", "Cybersecurity Uplift", "Cybersecurity", "Marcus Tan", "Critical", -3, "In Progress"],
    ["UAT sign-off for mobile onboarding release 4.2", "Collect business sign-off for release 4.2 of mobile onboarding.", "Digital Channels", "Application Development", "Aisha Rahman", "High", 5, "Blocked"],
    ["Define data retention rules for customer analytics", "Agree retention schedule with Compliance for the analytics lake.", "Data & Analytics", "Compliance", "Daniel Lim", "Medium", 30, "Backlog"],
    ["Renew core banking vendor support contract", "Negotiate and renew the 3-year support agreement.", "Vendor Management", "Vendor", "Grace Wong", "Medium", -7, "Blocked"],
    ["Decommission legacy batch scheduler", "Retire the end-of-life batch scheduler after job migration.", "Core Banking Upgrade", "Infrastructure", "Ravi Menon", "Low", 60, "Backlog"],
    ["Core banking DR failover test – Q3", "Execute and document the quarterly DR failover rehearsal.", "Core Banking Upgrade", "Infrastructure", "Sofia Chen", "High", -10, "Done"],
    ["Build executive KPI dashboard for IT operations", "Self-service dashboard covering incidents, change and SLA metrics.", "Data & Analytics", "Data", "Kevin Ong", "Medium", 14, "In Progress"]
  ];
  return seed.map(([title, description, project, category, assignee, priority, due, status]) => ({
    id: nextTaskId(), title, description, project, category, assignee, priority,
    dueDate: dateString(due), status
  }));
}

/* ===== Filtering ===== */
/* Open (not Done) task due between today and 7 days out. */
function isDueThisWeek(task) {
  const days = daysUntil(task.dueDate);
  return task.status !== "Done" && days >= 0 && days <= 7;
}

function matchesDue(task, due) {
  if (due === "overdue") return isOverdue(task);
  if (due === "week") return isDueThisWeek(task);
  return true;
}

function applyFilters(tasks) {
  const { project, assignee, priority, due } = state.filters;
  const needle = assignee.trim().toLowerCase();
  return tasks.filter(t =>
    (!project  || t.project === project) &&
    (!priority || t.priority === priority) &&
    (!needle   || t.assignee.toLowerCase().includes(needle)) &&
    matchesDue(t, due)
  );
}

/* ===== Rendering ===== */
function renderCard(task) {
  const overdue = isOverdue(task);
  const confirming = state.ui.confirmDeleteId === task.id;
  const moving = state.ui.moveOpenId === task.id;
  const id = escapeHtml(task.id);

  const deleteControl = confirming
    ? `<span class="confirm" role="group" aria-label="Confirm delete ${id}">Delete?
         <button type="button" class="link-btn danger" data-action="delete-yes" data-id="${id}" data-focus="del-yes-${id}">Yes</button>
         <button type="button" class="link-btn" data-action="delete-no" data-id="${id}" data-focus="del-no-${id}">No</button>
       </span>`
    : `<button type="button" class="icon-btn" data-action="delete" data-id="${id}" data-focus="del-${id}" aria-label="Delete task ${id}">×</button>`;

  const moveOptions = STATUSES.map(s =>
    `<option value="${escapeHtml(s)}"${s === task.status ? " selected" : ""}>${escapeHtml(s)}</option>`).join("");
  const moveControl = moving
    ? `<select class="move-select" data-action="move-select" data-id="${id}" data-focus="move-sel-${id}" aria-label="Move ${id} to column">${moveOptions}</select>
       <button type="button" class="link-btn" data-action="move-cancel" data-id="${id}" data-focus="move-cancel-${id}">Cancel</button>`
    : `<button type="button" class="link-btn" data-action="move-open" data-id="${id}" data-focus="move-${id}" aria-label="Move task ${id}">Move</button>`;

  return `
    <article class="card prio-${slug(task.priority)}" draggable="true" data-id="${id}" aria-label="${id}: ${escapeHtml(task.title)}">
      <div class="card-top">
        <span class="card-id">${id}</span>
        ${deleteControl}
      </div>
      <h3 class="card-title">${escapeHtml(task.title)}</h3>
      <p class="card-project">${escapeHtml(task.project)}</p>
      <div class="card-people">
        <span class="assignee"><span class="initials" aria-hidden="true">${escapeHtml(initials(task.assignee))}</span>${escapeHtml(task.assignee)}</span>
        <span class="due${overdue ? " is-late" : ""}">
          <span class="due-rel">${escapeHtml(dueLabel(task))}</span>
          <time class="due-date" datetime="${escapeHtml(task.dueDate)}">${task.status === "Done" ? "Due " : ""}${escapeHtml(formatDate(task.dueDate))}</time>
        </span>
      </div>
      <div class="card-foot">
        <span class="prio prio-${slug(task.priority)}">${escapeHtml(task.priority)}</span>
        <span class="tag">${escapeHtml(task.category)}</span>
        <span class="card-actions">${moveControl}</span>
      </div>
    </article>`;
}

/* Header summary: a sentence plus a flow bar whose segments are sized by task count. */
function renderSummary() {
  const total = state.tasks.length;
  const overdue = state.tasks.filter(isOverdue).length;
  const segments = STATUSES.map(s => {
    const n = state.tasks.filter(t => t.status === s).length;
    return `<li class="flow-seg${n ? "" : " is-empty"}" style="flex: ${n} 1 0">
        <span class="flow-bar swatch-${slug(s)}" aria-hidden="true"></span>
        <span class="flow-label"><strong>${n}</strong> ${escapeHtml(s)}</span>
      </li>`;
  }).join("");
  const late = overdue ? `<span class="summary-late">${overdue} overdue</span>` : "none overdue";
  document.getElementById("summary").innerHTML = `
    <p class="summary-line">${total} ${total === 1 ? "task" : "tasks"} on the board, ${late}</p>
    <ul class="flow">${segments}</ul>`;
}

function renderBoard() {
  const visible = applyFilters(state.tasks);
  const board = document.getElementById("board");

  board.innerHTML = STATUSES.map(status => {
    const cards = visible.filter(t => t.status === status);
    const body = cards.length
      ? cards.map(renderCard).join("")
      : '<p class="empty">No tasks</p>';
    return `
      <section class="column" data-status="${escapeHtml(status)}" aria-label="${escapeHtml(status)} column">
        <span class="lane-bar swatch-${slug(status)}" aria-hidden="true"></span>
        <div class="column-head">
          <h2>${escapeHtml(status)}</h2>
          <span class="count" aria-label="${cards.length} tasks">${cards.length}</span>
        </div>
        <p class="column-sub">${escapeHtml(STATUS_HINT[status])}</p>
        <div class="cards">${body}</div>
      </section>`;
  }).join("");

  renderSummary();
  document.getElementById("filter-note").textContent =
    `Showing ${visible.length} of ${state.tasks.length} tasks`;

  // Restore keyboard focus to the control the user just used (DOM was rebuilt).
  if (state.ui.focusKey) {
    const el = board.querySelector(`[data-focus="${CSS.escape(state.ui.focusKey)}"]`);
    if (el) el.focus();
    state.ui.focusKey = null;
  }
}

/* ===== State mutations ===== */
function moveTask(id, newStatus) {
  const task = state.tasks.find(t => t.id === id);
  if (!task || !STATUSES.includes(newStatus)) return;
  const changed = task.status !== newStatus;
  task.status = newStatus;
  state.ui.moveOpenId = null;
  state.ui.focusKey = "move-" + id;
  renderBoard();
  if (changed) showToast(`${id} moved to ${newStatus}`);
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  state.ui.confirmDeleteId = null;
  renderBoard();
  showToast(`${id} deleted`);
}

function addTask(values) {
  const task = {
    id: nextTaskId(),
    title: values.title.trim(),
    description: values.description.trim(),
    project: values.project,
    category: values.category,
    assignee: values.assignee.trim(),
    priority: values.priority,
    dueDate: values.dueDate,
    status: values.status
  };
  state.tasks.push(task);
  renderBoard();
  return task;
}

/* ===== Status update: plain-text weekly summary for stakeholders ===== */
function buildStatusUpdate() {
  const tasks = state.tasks;
  const line = t => `- ${t.id}: ${t.title} (${t.assignee}, ${dueLabel(t).toLowerCase()})`;
  const section = (heading, list) =>
    `${heading} (${list.length})\n` + (list.length ? list.map(line).join("\n") : "- None");
  const counts = STATUSES.map(s => `${tasks.filter(t => t.status === s).length} ${s}`).join(", ");
  const byDue = (a, b) => a.dueDate.localeCompare(b.dueDate);

  return [
    `IT PMO status update, ${formatDate(dateString(0))}`,
    `Board: ${tasks.length} ${tasks.length === 1 ? "task" : "tasks"} (${counts})`,
    section("Overdue", tasks.filter(isOverdue).sort(byDue)),
    section("Blocked", tasks.filter(t => t.status === "Blocked").sort(byDue)),
    section("Due in the next 7 days", tasks.filter(isDueThisWeek).sort(byDue)),
    section("Completed", tasks.filter(t => t.status === "Done"))
  ].join("\n\n");
}

function openStatus() {
  document.getElementById("status-text").value = buildStatusUpdate();
  const dlg = document.getElementById("status-dialog");
  if (!dlg.open) dlg.showModal();
  document.getElementById("copy-status").focus();
}
function closeStatus() {
  const dlg = document.getElementById("status-dialog");
  if (dlg.open) dlg.close();
  document.getElementById("open-status").focus();
}

async function copyStatus() {
  const text = document.getElementById("status-text");
  try {
    await navigator.clipboard.writeText(text.value);
    showToast("Status update copied");
  } catch (err) {
    text.focus();
    text.select();
    showToast("Copy blocked by the browser. The text is selected: press Ctrl+C.", "warn");
  }
}

/* ===== Toasts ===== */
function showToast(message, kind = "success") {
  const el = document.createElement("div");
  el.className = "toast" + (kind === "warn" ? " warn" : "");
  el.textContent = message;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "warn" ? 6000 : 3500);
}

/* ===== FormSubmit integration ===== */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString()
    })
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* ===== Form: validation + submit ===== */
const FIELD_KEYS = ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"];
const FIELD_INPUT_ID = {
  title: "f-title", description: "f-description", project: "f-project", category: "f-category",
  assignee: "f-assignee", priority: "f-priority", dueDate: "f-due", status: "f-status"
};

function readForm() {
  const values = {};
  FIELD_KEYS.forEach(k => { values[k] = document.getElementById(FIELD_INPUT_ID[k]).value; });
  return values;
}

function validateTask(v) {
  const errors = {};
  const title = v.title.trim();
  if (!title) errors.title = "Task title is required.";
  else if (title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (v.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!PROJECTS.includes(v.project)) errors.project = "Choose a project.";
  if (!CATEGORIES.includes(v.category)) errors.category = "Choose a category.";
  if (!v.assignee.trim()) errors.assignee = "Assignee is required.";
  if (!PRIORITIES.includes(v.priority)) errors.priority = "Choose a priority.";
  if (!v.dueDate) errors.dueDate = "Due date is required.";
  else if (v.dueDate < dateString(0)) errors.dueDate = "Due date cannot be in the past.";
  if (!STATUSES.includes(v.status)) errors.status = "Choose a status.";
  return errors;
}

function setFieldError(key, msg) {
  const input = document.getElementById(FIELD_INPUT_ID[key]);
  document.getElementById("err-" + key).textContent = msg;
  if (msg) input.setAttribute("aria-invalid", "true");
  else input.removeAttribute("aria-invalid");
}

/* Inline errors on every field, plus a focused summary that links to each invalid field. */
function showErrors(errors) {
  FIELD_KEYS.forEach(k => setFieldError(k, errors[k] || ""));
  const keys = FIELD_KEYS.filter(k => errors[k]);
  const summary = document.getElementById("error-summary");
  summary.hidden = !keys.length;
  if (!keys.length) return;
  document.getElementById("error-summary-title").textContent =
    keys.length === 1 ? "Fix 1 problem to add this task" : `Fix ${keys.length} problems to add this task`;
  document.getElementById("error-summary-list").innerHTML = keys.map(k =>
    `<li><a href="#${FIELD_INPUT_ID[k]}" data-field="${FIELD_INPUT_ID[k]}">${escapeHtml(errors[k])}</a></li>`).join("");
  summary.focus();
}

/* Validate a single field when the user leaves it, once it has a value or is already flagged. */
function validateOnBlur(e) {
  const key = FIELD_KEYS.find(k => FIELD_INPUT_ID[k] === e.target.id);
  if (!key) return;
  if (!e.target.value && e.target.getAttribute("aria-invalid") !== "true") return;
  setFieldError(key, validateTask(readForm())[key] || "");
}

function resetForm() {
  document.getElementById("task-form").reset();
  document.getElementById("f-priority").value = "Medium";
  document.getElementById("f-status").value = "Backlog";
  showErrors({});
}

async function handleSubmit(event) {
  event.preventDefault();
  const values = readForm();
  const errors = validateTask(values);
  showErrors(errors);
  if (Object.keys(errors).length) return;

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "Sending…";

  // Optimistic UI: card appears immediately, network call runs after.
  const task = addTask(values);
  resetForm();

  try {
    await notifyNewTask(task);
    showToast(`Task ${task.id} added — email notification sent`);
  } catch (err) {
    showToast("Card added locally — email notification failed", "warn");
  } finally {
    btn.disabled = false;
    btn.textContent = "Add task";
    closeDialog();
  }
}

/* ===== Dialog open/close ===== */
function openDialog() {
  const dlg = document.getElementById("add-dialog");
  document.getElementById("f-due").min = dateString(0);
  if (!dlg.open) dlg.showModal();
  document.getElementById("f-title").focus();
}
function closeDialog() {
  const dlg = document.getElementById("add-dialog");
  if (dlg.open) dlg.close();
  document.getElementById("open-add").focus();
}

/* ===== Drag and drop (native HTML5) via event delegation on the board ===== */
function wireDragAndDrop(board) {
  board.addEventListener("dragstart", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    state.ui.dragId = card.dataset.id;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", card.dataset.id);
    card.classList.add("dragging");
  });
  board.addEventListener("dragend", () => {
    state.ui.dragId = null;
    board.querySelectorAll(".dragging, .drop-target").forEach(el => el.classList.remove("dragging", "drop-target"));
  });
  board.addEventListener("dragover", e => {
    const col = e.target.closest(".column");
    if (!col || !state.ui.dragId) return;
    e.preventDefault(); // required to allow a drop
    e.dataTransfer.dropEffect = "move";
    col.classList.add("drop-target");
  });
  board.addEventListener("dragleave", e => {
    const col = e.target.closest(".column");
    if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop-target");
  });
  board.addEventListener("drop", e => {
    const col = e.target.closest(".column");
    if (!col) return;
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain") || state.ui.dragId;
    state.ui.dragId = null;
    moveTask(id, col.dataset.status);
  });
}

/* ===== Card button handling (move menu + inline delete confirm) ===== */
function wireCardActions(board) {
  board.addEventListener("click", e => {
    const btn = e.target.closest("[data-action]");
    if (!btn || btn.tagName === "SELECT") return;
    const id = btn.dataset.id;
    switch (btn.dataset.action) {
      case "delete":
        state.ui.confirmDeleteId = id;
        state.ui.focusKey = "del-no-" + id;
        renderBoard();
        break;
      case "delete-no":
        state.ui.confirmDeleteId = null;
        state.ui.focusKey = "del-" + id;
        renderBoard();
        break;
      case "delete-yes":
        deleteTask(id);
        break;
      case "move-open":
        state.ui.moveOpenId = id;
        state.ui.focusKey = "move-sel-" + id;
        renderBoard();
        break;
      case "move-cancel":
        state.ui.moveOpenId = null;
        state.ui.focusKey = "move-" + id;
        renderBoard();
        break;
    }
  });
  board.addEventListener("change", e => {
    if (e.target.dataset.action === "move-select") moveTask(e.target.dataset.id, e.target.value);
  });
}

/* ===== Init: populate selects, wire events, first render ===== */
function fillSelect(select, options, placeholder) {
  const first = placeholder ? `<option value="">${escapeHtml(placeholder)}</option>` : "";
  select.innerHTML = first + options.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("");
}

function init() {
  fillSelect(document.getElementById("filter-project"), PROJECTS, "All projects");
  fillSelect(document.getElementById("filter-priority"), PRIORITIES, "All priorities");
  fillSelect(document.getElementById("f-project"), PROJECTS);
  fillSelect(document.getElementById("f-category"), CATEGORIES);
  fillSelect(document.getElementById("f-priority"), PRIORITIES);
  fillSelect(document.getElementById("f-status"), STATUSES);
  document.getElementById("f-priority").value = "Medium";

  state.tasks = seedTasks();

  const board = document.getElementById("board");
  wireDragAndDrop(board);
  wireCardActions(board);

  document.getElementById("filter-project").addEventListener("change", e => { state.filters.project = e.target.value; renderBoard(); });
  document.getElementById("filter-priority").addEventListener("change", e => { state.filters.priority = e.target.value; renderBoard(); });
  document.getElementById("filter-assignee").addEventListener("input", e => { state.filters.assignee = e.target.value; renderBoard(); });
  document.getElementById("filter-due").addEventListener("change", e => { state.filters.due = e.target.value; renderBoard(); });
  document.getElementById("clear-filters").addEventListener("click", () => {
    state.filters = { project: "", assignee: "", priority: "", due: "" };
    document.getElementById("filter-project").value = "";
    document.getElementById("filter-priority").value = "";
    document.getElementById("filter-assignee").value = "";
    document.getElementById("filter-due").value = "";
    renderBoard();
  });

  document.getElementById("open-status").addEventListener("click", openStatus);
  document.getElementById("close-status").addEventListener("click", closeStatus);
  document.getElementById("done-status").addEventListener("click", closeStatus);
  document.getElementById("copy-status").addEventListener("click", copyStatus);

  document.getElementById("task-form").addEventListener("focusout", validateOnBlur);
  document.getElementById("error-summary").addEventListener("click", e => {
    const link = e.target.closest("[data-field]");
    if (!link) return;
    e.preventDefault();
    document.getElementById(link.dataset.field).focus();
  });

  document.getElementById("open-add").addEventListener("click", openDialog);
  document.getElementById("close-add").addEventListener("click", closeDialog);
  document.getElementById("cancel-add").addEventListener("click", () => { resetForm(); closeDialog(); });
  document.getElementById("task-form").addEventListener("submit", handleSubmit);

  renderBoard();
}

init();
</script>
