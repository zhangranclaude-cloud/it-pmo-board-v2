name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check the script
        run: |
          test -f index.html
          sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d' > /tmp/app.js
          node --check /tmp/app.js

      - name: Guard against forbidden constructs
        run: |
          if grep -nE 'localStorage|sessionStorage|indexedDB|document\.cookie' index.html; then
            echo "::error::Storage APIs are not allowed"; exit 1; fi
          if grep -nE 'eval\(|new Function|document\.write|!important|alert\(|confirm\(' index.html; then
            echo "::error::Forbidden construct found"; exit 1; fi

      - name: Guard against external resources
        run: |
          if grep -nE '<script[^>]*src|<link[^>]*href="http|<img[^>]*src="http|@import|url\(\s*["'\'']?http' index.html; then
            echo "::error::External resources are not allowed"; exit 1; fi
